<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postingan - Node.js CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 leading-normal tracking-normal min-h-screen flex flex-col">

    <!-- ===== Navbar ===== -->
    <nav class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200/70">
        <div class="container mx-auto px-6 max-w-5xl h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white grid place-items-center font-extrabold shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition">N</span>
                <span class="font-bold text-lg tracking-tight">Node<span class="text-indigo-600">CMS</span></span>
            </a>
            <a href="/" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 inline-flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                Semua postingan
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-6 max-w-3xl flex-1 py-12">
        <article id="postDetail" class="bg-white border border-slate-200 rounded-2xl p-8 md:p-12 shadow-sm">
            <div class="text-slate-400 animate-pulse">Memuat postingan…</div>
        </article>
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="container mx-auto px-6 max-w-5xl py-6 flex items-center justify-between text-sm text-slate-400">
            <span>&copy; 2026 Node CMS</span>
            <span class="flex items-center gap-1.5">Dibangun dengan <span class="font-semibold text-slate-500">Node.js &amp; Firestore</span></span>
        </div>
    </footer>

    <script>
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function fetchPost() {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('postDetail');

            if (!id) {
                container.innerHTML = renderNotFound('Link tidak valid — ID postingan tidak ditemukan.');
                return;
            }

            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(id)}`);
                if (res.status === 404) {
                    document.title = 'Tidak Ditemukan - Node.js CMS';
                    container.innerHTML = renderNotFound('Postingan yang dicari tidak ada atau belum diterbitkan.');
                    return;
                }
                if (!res.ok) {
                    container.innerHTML = renderNotFound('Terjadi kesalahan saat memuat postingan.');
                    return;
                }

                const post = await res.json();
                document.title = `${post.title} - Node.js CMS`;
                container.innerHTML = `
                    <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600">
                        ${new Date(post.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}
                    </span>
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 mt-3 leading-tight">
                        ${escapeHtml(post.title)}
                    </h1>
                    <div class="mt-5 h-1.5 w-16 rounded-full bg-gradient-to-r from-indigo-500 to-violet-600"></div>
                    ${post.image ? `<img alt="Gambar postingan ${escapeHtml(post.title)}" src="${escapeHtml(post.image)}" class="mt-8 w-full aspect-video object-cover rounded-2xl border border-slate-200">` : ''}
                    <div class="mt-8 text-slate-600 leading-[1.9] whitespace-pre-line">${escapeHtml(post.content)}</div>
                `;
            } catch (error) {
                console.error('Gagal memuat post:', error);
                container.innerHTML = renderNotFound('Terjadi kesalahan jaringan.');
            }
        }

        function renderNotFound(message) {
            return `
                <div class="flex flex-col items-center text-center py-12">
                    <div class="w-16 h-16 rounded-2xl bg-slate-100 grid place-items-center mb-5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Tidak Ditemukan</h1>
                    <p class="text-slate-500 mt-2">${escapeHtml(message)}</p>
                    <a href="/" class="mt-6 inline-flex items-center gap-2 bg-indigo-600 text-white text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-indigo-700 shadow-lg shadow-indigo-500/25 transition">
                        Kembali ke beranda
                    </a>
                </div>`;
        }

        fetchPost();
    </script>
</body>
</html>
