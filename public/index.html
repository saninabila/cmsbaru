<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js CMS - Beranda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto p-6 max-w-4xl">
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Node.js CMS &amp; Firestore</h1>
                <p class="text-gray-600">Postingan Terbaru</p>
            </div>
            <a href="/admin" class="text-xs text-gray-400 hover:text-gray-600 border border-gray-300 px-3 py-2 rounded-lg hover:bg-white transition">Login Admin</a>
        </header>

        <!-- Daftar Konten Publik (hanya status published) -->
        <div id="postsList" class="space-y-4">
            <p class="text-gray-500">Memuat data...</p>
        </div>
    </div>

    <script>
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Ambil dan render postingan yang sudah dipublikasikan
        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts');
                const posts = await response.json();
                const container = document.getElementById('postsList');

                if (!Array.isArray(posts) || posts.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Belum ada postingan yang dipublikasikan.</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <a href="/post.html?id=${encodeURIComponent(post.id)}"
                       class="block bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                        <h2 class="text-xl font-bold text-gray-800">${escapeHtml(post.title)}</h2>
                        <p class="text-gray-600 mt-2">${escapeHtml(String(post.content).slice(0, 200))}${String(post.content).length > 200 ? '...' : ''}</p>
                        <span class="text-xs text-gray-400 mt-3 block">Diterbitkan: ${new Date(post.createdAt).toLocaleString()}</span>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                document.getElementById('postsList').innerHTML =
                    '<p class="text-red-600">Gagal memuat postingan.</p>';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
