<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js CMS - Beranda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 leading-normal tracking-normal min-h-screen flex flex-col">

    <!-- ===== Navbar ===== -->
    <nav class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200/70">
        <div class="container mx-auto px-6 max-w-5xl h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white grid place-items-center font-extrabold shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition">N</span>
                <span class="font-bold text-lg tracking-tight">Node<span class="text-indigo-600">CMS</span></span>
            </a>
            <a href="/admin"
               class="text-sm font-semibold text-slate-500 hover:text-slate-800 border border-slate-200 px-4 py-2 rounded-full hover:border-slate-300 hover:bg-white transition">
                Login Admin
            </a>
        </div>
    </nav>

    <!-- ===== Hero Carousel ===== -->
    <header class="container mx-auto px-6 max-w-5xl pt-8">
        <div id="heroCarousel" class="relative rounded-3xl overflow-hidden shadow-xl shadow-slate-300/50 min-h-[340px] md:min-h-[400px] group">
            <!-- Slide dipasang oleh JS di sini -->

            <!-- Panah kiri/kanan -->
            <button id="heroPrev" aria-label="Slide sebelumnya"
                    class="absolute left-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white/20 backdrop-blur text-white grid place-items-center opacity-0 group-hover:opacity-100 hover:bg-white/30 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <button id="heroNext" aria-label="Slide berikutnya"
                    class="absolute right-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white/20 backdrop-blur text-white grid place-items-center opacity-0 group-hover:opacity-100 hover:bg-white/30 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
            </button>

            <!-- Titik navigasi -->
            <div id="heroDots" class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10 flex gap-2"></div>
        </div>
    </header>

    <!-- ===== Daftar Postingan (hanya status published) ===== -->
    <main id="postingan" class="container mx-auto px-6 max-w-5xl flex-1 pb-16 scroll-mt-24">
        <div id="postsList" class="grid gap-6 sm:grid-cols-2">
            <div class="sm:col-span-2 text-slate-400 animate-pulse">Memuat postingan…</div>
        </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="border-t border-slate-200 bg-white">
        <div class="container mx-auto px-6 max-w-5xl py-6 flex items-center justify-between text-sm text-slate-400">
            <span>&copy; 2026 Node CMS</span>
            <span class="flex items-center gap-1.5">
                Dibangun dengan <span class="font-semibold text-slate-500">Node.js &amp; Firestore</span>
            </span>
        </div>
    </footer>

    <script>
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ===== Hero Carousel =====
        const SLIDE_STYLES = [
            'bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800',
            'bg-gradient-to-br from-violet-600 via-purple-600 to-fuchsia-700',
            'bg-gradient-to-br from-sky-600 via-cyan-600 to-teal-600',
        ];

        let heroSlides = [];
        let heroIndex = 0;
        let heroTimer = null;

        function defaultSlides() {
            return [
                {
                    kicker: 'Selamat Datang',
                    title: 'Nikmati artikel kami di Node CMS',
                    sub: 'Kumpulan artikel dan informasi terbaru yang sudah diterbitkan.',
                    href: '#postingan',
                    cta: 'Jelajahi postingan',
                },
                {
                    kicker: 'Konten Terkurasi',
                    title: 'Postingan segar setiap minggu',
                    sub: 'Admin menerbitkan konten baru secara berkala — jangan sampai ketinggalan.',
                    href: '#postingan',
                    cta: 'Lihat postingan',
                },
                {
                    kicker: 'Untuk Penulis',
                    title: 'Kelola konten lewat panel admin',
                    sub: 'Masuk ke area admin untuk menulis, mengedit, dan menerbitkan postingan Anda.',
                    href: '/admin',
                    cta: 'Masuk area admin',
                },
            ];
        }

        function slidesFromPosts(posts) {
            return posts.slice(0, 3).map(post => ({
                kicker: 'Postingan Unggulan',
                title: post.title,
                sub: String(post.content).slice(0, 110) + (String(post.content).length > 110 ? '…' : ''),
                href: `/post.html?id=${encodeURIComponent(post.id)}`,
                cta: 'Baca selengkapnya',
            }));
        }

        function renderHero() {
            const carousel = document.getElementById('heroCarousel');
            // Hapus slide lama, sisakan panah dan dots
            carousel.querySelectorAll('[data-hero-slide]').forEach(el => el.remove());

            heroSlides.forEach((slide, i) => {
                const el = document.createElement('div');
                el.dataset.heroSlide = i;
                // Slide bergambar: latar foto + overlay gelap; tanpa gambar: gradien warna
                const bg = slide.image
                    ? `<div class="absolute inset-0 bg-cover bg-center" style="background-image:url('${escapeHtml(slide.image)}')"></div>
                       <div class="absolute inset-0 bg-gradient-to-r from-slate-950/80 via-slate-900/60 to-slate-900/20"></div>`
                    : '';
                el.className = `${slide.image ? 'bg-slate-900' : SLIDE_STYLES[i % SLIDE_STYLES.length]} absolute inset-0 flex items-center px-8 md:px-14 py-12 overflow-hidden transition-opacity duration-700 ${i === heroIndex ? 'opacity-100' : 'opacity-0 pointer-events-none'}`;
                el.innerHTML = `
                    ${bg}
                    <div class="relative max-w-xl">
                        <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-white/90 bg-white/15 border border-white/20 px-3 py-1 rounded-full mb-4">${escapeHtml(slide.kicker)}</span>
                        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white leading-tight">${escapeHtml(slide.title)}</h2>
                        <p class="text-white/80 mt-3 leading-relaxed text-sm md:text-base">${escapeHtml(slide.sub)}</p>
                        <a href="${slide.href}" class="mt-6 inline-flex items-center gap-2 bg-white text-slate-900 text-sm font-bold px-5 py-2.5 rounded-full hover:gap-3 transition-all shadow-lg">${escapeHtml(slide.cta)}
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                        </a>
                    </div>`;
                carousel.insertBefore(el, document.getElementById('heroPrev'));
            });

            const dots = document.getElementById('heroDots');
            dots.innerHTML = heroSlides.map((_, i) => `
                <button aria-label="Ke slide ${i + 1}" data-dot="${i}"
                        class="h-2 rounded-full transition-all ${i === heroIndex ? 'w-6 bg-white' : 'w-2 bg-white/40 hover:bg-white/60'}"></button>`).join('');
        }

        function goToHero(i) {
            if (!heroSlides.length) return;
            heroIndex = (i + heroSlides.length) % heroSlides.length;
            renderHero();
            startAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(heroTimer);
            if (heroSlides.length > 1) {
                heroTimer = setInterval(() => goToHero(heroIndex + 1), 5000);
            }
        }

        document.getElementById('heroPrev').addEventListener('click', () => goToHero(heroIndex - 1));
        document.getElementById('heroNext').addEventListener('click', () => goToHero(heroIndex + 1));
        document.getElementById('heroDots').addEventListener('click', (e) => {
            const dot = e.target.closest('button[data-dot]');
            if (dot) goToHero(Number(dot.dataset.dot));
        });
        // Jeda otomatis ketika kursor di atas carousel
        const carouselEl = document.getElementById('heroCarousel');
        carouselEl.addEventListener('mouseenter', () => clearInterval(heroTimer));
        carouselEl.addEventListener('mouseleave', startAutoSlide);

        // Slide hero berdasarkan konfigurasi admin (jika ada); null = pakai slide otomatis
        async function fetchHeroConfig() {
            try {
                const res = await fetch('/api/hero');
                if (res.ok) {
                    const cfg = await res.json();
                    if (Array.isArray(cfg.slides) && cfg.slides.length > 0) {
                        return cfg.slides.map(s => ({ ...s, href: s.link || s.href || '#postingan' }));
                    }
                }
            } catch (e) { /* fallback ke slide otomatis */ }
            return null;
        }

        // Ambil dan render postingan yang sudah dipublikasikan
        async function fetchPosts() {
            try {
                const heroConfig = await fetchHeroConfig();
                const response = await fetch('/api/posts');
                const posts = await response.json();
                const container = document.getElementById('postsList');

                heroSlides = heroConfig || (Array.isArray(posts) && posts.length > 0 ? slidesFromPosts(posts) : defaultSlides());
                renderHero();
                startAutoSlide();

                if (!Array.isArray(posts) || posts.length === 0) {
                    container.innerHTML = `
                        <div class="sm:col-span-2 flex flex-col items-center text-center py-20 bg-white border border-dashed border-slate-300 rounded-2xl">
                            <div class="w-14 h-14 rounded-2xl bg-slate-100 grid place-items-center mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
                                </svg>
                            </div>
                            <p class="font-semibold text-slate-600">Belum ada postingan</p>
                            <p class="text-sm text-slate-400 mt-1">Postingan yang diterbitkan admin akan muncul di sini.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <a href="/post.html?id=${encodeURIComponent(post.id)}"
                       class="group relative flex flex-col bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl hover:shadow-slate-200/70 hover:-translate-y-1 hover:border-indigo-100 transition-all duration-300">
                        ${post.image ? `
                        <div class="h-44 overflow-hidden">
                            <img alt="Gambar postingan ${escapeHtml(post.title)}" src="${escapeHtml(post.image)}"
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>` : ''}
                        <div class="p-6 flex flex-col flex-1">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 mb-3">
                                ${new Date(post.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}
                            </span>
                            <h2 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">${escapeHtml(post.title)}</h2>
                            <p class="text-slate-500 text-sm mt-2 leading-relaxed line-clamp-3">${escapeHtml(String(post.content).slice(0, 220))}</p>
                            <span class="mt-auto pt-5 text-sm font-semibold text-indigo-600 inline-flex items-center gap-1 group-hover:gap-2 transition-all">
                                Baca selengkapnya
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                                </svg>
                            </span>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                heroSlides = defaultSlides();
                renderHero();
                startAutoSlide();
                document.getElementById('postsList').innerHTML =
                    '<p class="sm:col-span-2 text-center py-16 text-red-600 font-medium">Gagal memuat postingan.</p>';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
